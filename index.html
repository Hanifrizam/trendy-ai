<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trendy AI - Trend Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-main: #212121;
            --bg-sidebar: #171717;
            --bg-card: #2f2f2f;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ececec;
            --text-dim: #a1a1aa;
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }

        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }

        /* --- TOAST NOTIFICATION --- */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); color: white; padding: 14px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-left: 4px solid var(--accent-blue); transform: translateX(120%); animation: slideInToast 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; display: flex; align-items: center; gap: 12px; }
        .toast.error { border-left-color: #ef4444; }
        @keyframes slideInToast { to { transform: translateX(0); } }

        /* --- GUEST FORM SCREEN --- */
        #auth-screen { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.5s ease; }
        .auth-card { background: var(--bg-sidebar); border: 1px solid var(--border-color); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); animation: floatUp 0.6s ease forwards; }
        @keyframes floatUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .auth-card h2 { color: var(--text-main); font-size: 26px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .auth-card h2 i { color: var(--accent-blue); }
        .auth-card p { color: var(--text-dim); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        .auth-input, .auth-select { width: 100%; padding: 14px 18px; margin-bottom: 15px; background: var(--bg-card); border: 1px solid transparent; color: white; border-radius: 10px; outline: none; font-size: 14px; transition: all 0.3s; }
        .auth-input:focus, .auth-select:focus { border-color: var(--accent-blue); }
        .auth-btn { width: 100%; padding: 14px; background: white; color: black; border: none; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.3s; }
        .auth-btn:hover { background: #e5e5e5; }

        /* --- APP CONTAINER & SIDEBAR --- */
        #app-screen { display: none; width: 100%; height: 100%; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; opacity: 0; transition: opacity 0.3s; }
        .sidebar { width: 260px; background-color: var(--bg-sidebar); display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0; z-index: 100; transition: transform 0.3s ease; }
        .sidebar-header { font-size: 18px; font-weight: 700; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; color: var(--text-main); padding: 0 20px; }
        
        .new-chat-btn { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 8px; margin: 0 20px 20px 20px; cursor: pointer; font-weight: 500; display: flex; align-items: center; justify-content: flex-start; gap: 10px; transition: all 0.2s; font-size: 14px;}
        .new-chat-btn:hover { background: var(--bg-card); }
        
        .history-container { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 0 15px; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        .history-item { padding: 10px 12px; border-radius: 8px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; cursor: pointer; color: var(--text-dim); transition: 0.2s; }
        .history-item:hover { background: var(--bg-card); color: white; }
        .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 10px; }
        .delete-btn { color: #ef4444; cursor: pointer; opacity: 0; transition: 0.2s; }
        .history-item:hover .delete-btn { opacity: 0.8; }
        .delete-btn:hover { opacity: 1 !important; }

        .guest-profile { padding: 15px 20px; border-top: 1px solid var(--border-color); margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
        .profile-info { display: flex; flex-direction: column; }
        .guest-name { font-size: 14px; font-weight: 600; color: white; }
        .guest-detail { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        .logout-btn { color: var(--text-dim); cursor: pointer; transition: 0.2s; padding: 5px; }
        .logout-btn:hover { color: white; }

        /* --- MAIN CONTENT & CHAT AREA --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; position: relative; background: var(--bg-main); height: 100vh; }
        .mobile-header { display: none; padding: 15px 20px; align-items: center; border-bottom: 1px solid var(--border-color); background: var(--bg-main); z-index: 50; }
        .menu-toggle { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; }
        .mobile-title { font-weight: 600; margin-left: 15px; font-size: 16px; }

        .display-area { flex-grow: 1; overflow-y: auto; padding: 40px 15% 20px 15%; scroll-behavior: smooth; display: flex; flex-direction: column; }

        /* Welcome Message */
        .welcome-wrapper { margin: auto; text-align: center; max-width: 500px; animation: floatUp 0.6s ease; }
        .welcome-wrapper i { font-size: 48px; color: var(--text-dim); margin-bottom: 20px; }
        .welcome-wrapper h1 { font-size: 32px; margin-bottom: 10px; font-weight: 600; }
        .welcome-wrapper p { color: var(--text-dim); font-size: 15px; line-height: 1.6; }

        /* Chat Bubbles (UI Modern) */
        .chat-row { width: 100%; max-width: 768px; margin: 0 auto 30px auto; display: flex; flex-direction: column; animation: cardAppear 0.5s ease forwards; }
        
        .user-bubble { align-self: flex-end; background: var(--bg-card); padding: 12px 18px; border-radius: 18px; border-bottom-right-radius: 4px; max-width: 80%; font-size: 15px; color: white; margin-bottom: 20px; }
        
        .ai-bubble { align-self: flex-start; width: 100%; }
        .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .ai-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
        .ai-title i { color: var(--accent-blue); }
        .pdf-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px;}
        .pdf-btn:hover { background: rgba(255,255,255,0.1); }

        .ai-section { margin-bottom: 20px; }
        .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .color-analisis { color: var(--text-main); }
        .color-research { color: var(--accent-yellow); }
        .color-konten { color: var(--accent-purple); }
        .color-sales { color: var(--accent-green); }
        .color-visual { color: var(--accent-blue); }

        .content-body { line-height: 1.7; font-size: 15px; color: #d1d5db; }
        .content-body strong { color: white; font-weight: 600; }
        .content-body ul { padding-left: 20px; margin: 8px 0; }
        .content-body li { margin-bottom: 6px; }
        .visual-img { width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--border-color); object-fit: cover; }

        @keyframes cardAppear { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* --- INPUT AREA (Stays at bottom) --- */
        .input-area-wrapper { padding: 10px 15% 30px 15%; background: linear-gradient(to top, var(--bg-main) 70%, transparent); }
        
        /* Mobile Slider Toggles */
        .toggles-container { display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-bottom: 12px; padding-bottom: 5px;}
        .toggle-pill { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-dim); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; flex-shrink: 0; }
        .toggle-pill.active { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.3); }

        /* Chat Input Box */
        .chat-input-box { background: var(--bg-card); border-radius: 24px; padding: 8px 12px 8px 20px; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; transition: 0.3s; }
        .chat-input-box:focus-within { border-color: rgba(255,255,255,0.2); }
        .platform-select { background: transparent; color: var(--text-dim); border: none; outline: none; font-size: 14px; font-weight: 500; cursor: pointer; border-right: 1px solid rgba(255,255,255,0.1); padding-right: 10px; }
        .platform-select option { background: var(--bg-card); color: white; }
        .chat-input { flex-grow: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; padding: 10px 0; }
        .chat-input::placeholder { color: #71717a; }
        
        .send-btn { background: white; color: black; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; flex-shrink: 0;}
        .send-btn:hover { background: #d4d4d8; }

        .loading-indicator { display: none; text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 10px; font-weight: 500;}
        .loading-indicator i { animation: spin 1s linear infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- PDF HIDDEN CONTAINER --- */
        #pdf-secret-container { position: absolute; left: -9999px; top: 0; width: 800px; background: white; color: black; padding: 40px; box-sizing: border-box; z-index: -1; font-family: sans-serif; }

        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { position: fixed; left: -100%; top: 0; bottom: 0; }
            .sidebar.active { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .display-area { padding: 20px 5% 20px 5%; }
            .input-area-wrapper { padding: 10px 5% 20px 5%; }
            .user-bubble { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="auth-screen">
        <div class="auth-card">
            <h2><i class="fa-solid fa-bolt"></i> Trendy AI</h2>
            <p>Ruang kerja cerdas untuk riset pasar. Silakan isi data sesi Anda.</p>
            <input type="text" id="guest-name" class="auth-input" placeholder="Nama Lengkap / Panggilan" required>
            <input type="text" id="guest-region" class="auth-input" placeholder="Asal Daerah (Cth: Bogor)" required>
            <select id="guest-has-business" class="auth-select" onchange="toggleBusinessInput()">
                <option value="no">Belum Punya Usaha</option>
                <option value="yes">Sudah Punya Usaha</option>
            </select>
            <input type="text" id="guest-business-name" class="auth-input" placeholder="Nama Usaha Anda" style="display:none;">
            <button class="auth-btn" onclick="startGuestSession()">Mulai Analisis</button>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header"><i class="fa-solid fa-bolt"></i> Trendy AI</div>
            <button class="new-chat-btn" onclick="startNewChat()"><i class="fa-solid fa-pen-to-square"></i> Topik Baru</button>
            <div class="history-container" id="history-list"></div>
            <div class="guest-profile">
                <div class="profile-info">
                    <span class="guest-name" id="display-guest-name">Guest User</span>
                    <span class="guest-detail" id="display-guest-detail">Belum punya usaha</span>
                </div>
                <i class="fa-solid fa-sign-out-alt logout-btn" onclick="endSession()" title="Akhiri Sesi"></i>
            </div>
        </div>

        <div class="main-content">
            <div class="mobile-header">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="mobile-title">Trendy Intelligence</div>
            </div>

            <div class="display-area" id="display-area">
                <div class="welcome-wrapper" id="welcome-msg">
                    <i class="fa-solid fa-brain"></i>
                    <h1>Trendy Intelligence</h1>
                    <p>Tentukan tren, pilih jenis analisis di bawah, dan dapatkan strategi pemasaran instan ala Gen-Z.</p>
                </div>
            </div>

            <div class="input-area-wrapper">
                <div class="loading-indicator" id="loading-overlay"><i class="fa-solid fa-spinner"></i> Menganalisis data...</div>
                
                <div class="toggles-container">
                    <button class="toggle-pill active" id="toggle-content" onclick="this.classList.toggle('active')"><i class="fa-solid fa-video"></i> Ide Konten</button>
                    <button class="toggle-pill active" id="toggle-sales" onclick="this.classList.toggle('active')"><i class="fa-solid fa-tags"></i> Strategi Jualan</button>
                    <button class="toggle-pill" id="toggle-research" onclick="this.classList.toggle('active')"><i class="fa-solid fa-chart-line"></i> Research Penjualan</button>
                    <button class="toggle-pill" id="toggle-image" onclick="this.classList.toggle('active')"><i class="fa-solid fa-image"></i> Visual AI</button>
                </div>

                <div class="chat-input-box">
                    <select id="input-platform" class="platform-select">
                        <option value="TikTok">TikTok</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Twitter">X / Twitter</option>
                    </select>
                    <input type="text" id="input-topic" class="chat-input" placeholder="Ketik topik tren (misal: Roti Lumer)..." autocomplete="off" onkeypress="handleEnter(event)">
                    <button class="send-btn" onclick="processAnalysis()"><i class="fa-solid fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="pdf-secret-container"></div>

    <script>
        // --- KONFIGURASI ---
        const supabaseUrl = 'https://cidccxpjstqnpisuxkcm.supabase.co'; 
        const supabaseKey = 'sb_publishable_CM0leWbXShfwZ9riFphpYQ_r7kRQUPm'; 
        const geminiApiKey = 'AIzaSyA4qZIpPpl4SItjhzZ2yPhzkxhis24wF10'; 
        const groqApiKey = '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'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let guestData = { id: '', name: '', region: '', business: '' };

        // UUID Generator for reliable DB tracking
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // --- UI HELPERS ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-exclamation"></i>';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOutToast 0.4s forwards'; setTimeout(() => toast.remove(), 400); }, 3000);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        function handleEnter(e) { if (e.key === 'Enter') processAnalysis(); }

        // MENGHAPUS LAYAR = TOPIK BARU
        function startNewChat() {
            const displayArea = document.getElementById('display-area');
            displayArea.innerHTML = `
                <div class="welcome-wrapper" id="welcome-msg">
                    <i class="fa-solid fa-brain"></i>
                    <h1>Trendy Intelligence</h1>
                    <p>Tentukan tren, pilih jenis analisis di bawah, dan dapatkan strategi pemasaran instan ala Gen-Z.</p>
                </div>
            `;
            document.getElementById('input-topic').value = '';
            document.getElementById('input-topic').focus();
            if(window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('active')) {
                toggleSidebar();
            }
        }

        // --- GUEST MANAGEMENT ---
        function toggleBusinessInput() {
            const val = document.getElementById('guest-has-business').value;
            const input = document.getElementById('guest-business-name');
            input.style.display = (val === 'yes') ? 'block' : 'none';
        }

        function startGuestSession() {
            const name = document.getElementById('guest-name').value.trim();
            const region = document.getElementById('guest-region').value.trim();
            const hasBusiness = document.getElementById('guest-has-business').value;
            const businessName = document.getElementById('guest-business-name').value.trim();

            if (!name || !region) return showToast("Nama & Asal Daerah wajib diisi!", "error");
            if (hasBusiness === 'yes' && !businessName) return showToast("Nama Usaha wajib diisi!", "error");

            guestData = { 
                id: generateUUID(), 
                name: name, 
                region: region, 
                business: hasBusiness === 'yes' ? businessName : 'Belum punya usaha' 
            };
            localStorage.setItem('trendy_guest', JSON.stringify(guestData));

            applyGuestData();
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                showToast("Sesi dimulai, siap menganalisis!");
                fetchHistory();
            }, 400);
        }

        function applyGuestData() {
            if(guestData && guestData.id) {
                document.getElementById('display-guest-name').innerText = guestData.name;
                document.getElementById('display-guest-detail').innerText = guestData.business + " | " + guestData.region;
            }
        }

        function checkSession() {
            const saved = localStorage.getItem('trendy_guest');
            if (saved) {
                guestData = JSON.parse(saved);
                if (!guestData.id || guestData.id.length < 10) {
                    localStorage.removeItem('trendy_guest');
                    return location.reload();
                }
                applyGuestData();
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                fetchHistory();
            }
        }

        function endSession() { localStorage.removeItem('trendy_guest'); location.reload(); }
        window.onload = checkSession;

        // --- PDF EXPORT (TEXT ONLY & RAPI) ---
        function downloadPDF(reportId, topicName) {
            showToast("Menyiapkan dokumen PDF...");
            const reportElement = document.getElementById(reportId);
            const secretContainer = document.getElementById('pdf-secret-container');
            
            // Membangun HTML Bersih khusus untuk PDF
            let cleanHtml = `<div style="padding: 20px; font-family: sans-serif; color: black; line-height: 1.5;">`;
            cleanHtml += `<h1 style="border-bottom: 2px solid #ccc; padding-bottom: 10px; font-size: 24px; margin-bottom: 20px;">Laporan Trendy AI: ${topicName}</h1>`;
            
            const sections = reportElement.querySelectorAll('.ai-section');
            sections.forEach(sec => {
                const titleEl = sec.querySelector('.section-label');
                const bodyEl = sec.querySelector('.content-body');
                if (titleEl && bodyEl && !titleEl.innerText.includes('Visual')) {
                    cleanHtml += `<div style="margin-bottom: 20px; page-break-inside: avoid;">`;
                    cleanHtml += `<h3 style="color: #3b82f6; font-size: 16px; margin-bottom: 8px; text-transform: uppercase;">${titleEl.innerText}</h3>`;
                    cleanHtml += `<div style="font-size: 14px; color: #333;">${bodyEl.innerHTML}</div>`;
                    cleanHtml += `</div>`;
                }
            });
            cleanHtml += `</div>`;
            secretContainer.innerHTML = cleanHtml;

            const opt = {
                margin: 15, filename: `TrendyAI_${topicName.replace(/\s+/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(secretContainer).save().then(() => {
                showToast("PDF Berhasil Diunduh!"); secretContainer.innerHTML = ''; 
            });
        }

        // --- PARSER ---
        function formatMarkdown(text) {
            if (!text) return "";
            let f = text.replace(/\*\*/g, '').replace(/\*/g, '').replace(/###/g, '').replace(/##/g, '');
            f = f.replace(/^[\-\•]\s+(.*)$/gm, '<ul style="margin-left:20px;"><li>$1</li></ul>');
            f = f.replace(/\n/g, '<br>');
            f = f.replace(/<\/ul><br><ul[^>]*>/g, '');
            return f.trim();
        }

        function extractSection(text, tag) {
            const regex = new RegExp(`\\${tag}([\\s\\S]*?)(?=\\[[A-Z]+\\]|$)`, 'i');
            const match = text.match(regex);
            return match ? match[1].trim() : '';
        }

        // --- CHAT RENDERER ---
        function renderResultToDisplay(topic, platform, aiText, isHistoryClick = false, isVisualRequested = false) {
            const area = document.getElementById('display-area');
            const welcome = document.getElementById('welcome-msg');
            if (welcome) welcome.style.display = 'none';

            const showVisual = isHistoryClick ? aiText.includes('[IMAGEPROMPT]') : isVisualRequested;
            const reportId = 'report_' + Math.random().toString(36).substr(2, 9);
            
            // 1. User Message Bubble (Hanya muncul jika bukan klik dari history, agar terasa seperti chat baru)
            let chatHtml = '';
            if (!isHistoryClick) {
                chatHtml += `<div class="chat-row"><div class="user-bubble">Tolong analisis tren <strong>${topic}</strong> di ${platform}.</div></div>`;
            }

            // 2. AI Response Bubble
            chatHtml += `<div class="chat-row" id="${reportId}"><div class="ai-bubble">`;
            chatHtml += `
                <div class="ai-header">
                    <div class="ai-title"><i class="fa-solid fa-bolt"></i> Trendy Intelligence</div>
                    <button class="pdf-btn" onclick="downloadPDF('${reportId}', '${topic}')"><i class="fa-solid fa-download"></i> PDF</button>
                </div>
            `;

            const sectionsData = [
                { tag: '[ANALISIS]', title: 'Analisis Singkat', icon: 'fa-magnifying-glass', color: 'color-analisis' },
                { tag: '[RESEARCH]', title: 'Research Penjualan', icon: 'fa-chart-line', color: 'color-research' },
                { tag: '[KONTEN]', title: 'Ide Konten', icon: 'fa-video', color: 'color-konten' },
                { tag: '[JUALAN]', title: 'Strategi Jualan', icon: 'fa-tags', color: 'color-sales' }
            ];

            let hasParsedData = false;
            sectionsData.forEach(sec => {
                const content = extractSection(aiText, sec.tag);
                if (content) {
                    hasParsedData = true;
                    chatHtml += `<div class="ai-section"><div class="section-label ${sec.color}"><i class="fa-solid ${sec.icon}"></i> ${sec.title}</div><div class="content-body">${formatMarkdown(content)}</div></div>`;
                }
            });

            // Fallback unformatted text
            if (!hasParsedData && aiText.trim().length > 10) {
                 chatHtml += `<div class="ai-section"><div class="content-body">${formatMarkdown(aiText)}</div></div>`;
            }

            // Visual AI
            if (showVisual) {
                let safePrompt = encodeURIComponent(topic.replace(/[^a-zA-Z0-9\s]/g, '') + " aesthetic modern minimalist product photography");
                let imgUrl = `https://image.pollinations.ai/prompt/${safePrompt}?width=800&height=450&nologo=true&seed=${Math.floor(Math.random()*100000)}`;
                chatHtml += `<div class="ai-section"><div class="section-label color-visual"><i class="fa-solid fa-image"></i> Visual AI</div><img src="${imgUrl}" class="visual-img"></div>`;
            }

            chatHtml += `</div></div>`; // End AI Bubble & Row
            
            if (isHistoryClick) { area.innerHTML = chatHtml; } 
            else { area.insertAdjacentHTML('beforeend', chatHtml); }
            
            setTimeout(() => { area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' }); }, 100);
            if(window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
        }

        // --- HYBRID AI ENGINE ---
        async function fetchAIResponse(prompt) {
            try {
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await resp.json();
                if (data.candidates) return { source: 'Gemini', text: data.candidates[0].content.parts[0].text };
            } catch (e) { console.warn("Gemini limit, pindah Groq..."); }

            const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${groqApiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: "llama-3.1-8b-instant", messages: [{ role: "user", content: prompt }] })
            });
            const data = await resp.json();
            if (data.choices) return { source: 'Llama 3.1', text: data.choices[0].message.content };
            throw new Error("Server AI Sibuk.");
        }

        // --- MAIN LOGIC ---
        async function processAnalysis() {
            if (!guestData || !guestData.id) return showToast("Sesi habis!", "error");

            const topic = document.getElementById('input-topic').value.trim();
            const platform = document.getElementById('input-platform').value;
            const business = guestData.business || 'UMKM';
            
            const isContent = document.getElementById('toggle-content').classList.contains('active');
            const isSales = document.getElementById('toggle-sales').classList.contains('active');
            const isResearch = document.getElementById('toggle-research').classList.contains('active');
            const isImage = document.getElementById('toggle-image').classList.contains('active');

            if (!topic) return showToast("Ketik topik tren!", "error");
            if (!isContent && !isSales && !isImage && !isResearch) return showToast("Pilih minimal 1 fitur!", "error");

            document.getElementById('loading-overlay').style.display = 'block';

            try {
                // 1. SMART CACHE
                const { data: allCache } = await supabaseClient.from('trends_data').select('*').eq('platform', platform).order('created_at', { ascending: false });
                let existingEntry = null;
                let exData = { analisis: '', konten: '', jualan: '', research: '', imageprompt: '' };

                if (allCache) {
                    let st = topic.toLowerCase();
                    for (let item of allCache) {
                        let dbT = item.trending_topic.toLowerCase();
                        if (dbT === st || (dbT.includes(st) && Math.abs(dbT.length - st.length) < 5)) {
                            existingEntry = item;
                            let t = item.ai_suggestion || '';
                            if (t.includes('[ANALISIS]')) exData.analisis = extractSection(t, '[ANALISIS]');
                            if (t.includes('[KONTEN]')) exData.konten = extractSection(t, '[KONTEN]');
                            if (t.includes('[JUALAN]')) exData.jualan = extractSection(t, '[JUALAN]');
                            if (t.includes('[RESEARCH]')) exData.research = extractSection(t, '[RESEARCH]');
                            if (t.includes('[IMAGEPROMPT]')) exData.imageprompt = extractSection(t, '[IMAGEPROMPT]');
                            break; 
                        }
                    }
                }

                let reqA = true && !exData.analisis; 
                let reqC = isContent && !exData.konten;
                let reqS = isSales && !exData.jualan;
                let reqR = isResearch && !exData.research;
                let reqI = isImage && !exData.imageprompt;

                if (!reqA && !reqC && !reqS && !reqR && !reqI && existingEntry) {
                    document.getElementById('loading-overlay').style.display = 'none';
                    let disp = '';
                    if (exData.analisis) disp += `\n[ANALISIS]\n${exData.analisis}\n`;
                    if (exData.research) disp += `\n[RESEARCH]\n${exData.research}\n`;
                    if (exData.konten) disp += `\n[KONTEN]\n${exData.konten}\n`;
                    if (exData.jualan) disp += `\n[JUALAN]\n${exData.jualan}\n`;
                    if (exData.imageprompt) disp += `\n[IMAGEPROMPT]\nOK\n`;

                    renderResultToDisplay(topic, platform, disp, false, isImage);

                    if (existingEntry.user_id !== guestData.id) {
                        await supabaseClient.from('trends_data').insert([{ platform: existingEntry.platform, trending_topic: existingEntry.trending_topic, ai_suggestion: disp, user_id: guestData.id }]);
                        fetchHistory();
                    }
                    document.getElementById('input-topic').value = '';
                    return; 
                }

                // 2. FETCH AI
                let prompt = `Sebagai pakar digital marketing, analisis tren "${topic}" di platform ${platform} untuk bisnis: ${business}.
                DILARANG menggunakan simbol bintang (*) atau hashtag (#). Gunakan format list bullet berupa strip (-).
                HANYA berikan respons untuk tag di bawah ini:\n`;
                if (reqA) prompt += `\n[ANALISIS]\nPenjelasan 2 kalimat mengapa topik ini viral.\n`;
                if (reqR) prompt += `\n[RESEARCH]\nAnalisis potensi minat pasar, bahan baku, atau peluang usaha.\n`;
                if (reqC) prompt += `\n[KONTEN]\n2 ide video viral "out of the box" (Sebutkan Hook & Visual).\n`;
                if (reqS) prompt += `\n[JUALAN]\n1 strategi promo/CTA yang memancing FOMO.\n`;
                if (reqI) prompt += `\n[IMAGEPROMPT]\nOK\n`;

                const ai = await fetchAIResponse(prompt);
                const txt = ai.text;

                let cFinal = '';
                cFinal += `\n[ANALISIS]\n${exData.analisis || extractSection(txt, '[ANALISIS]')}\n`;
                if (reqC || exData.konten) cFinal += `\n[KONTEN]\n${exData.konten || extractSection(txt, '[KONTEN]')}\n`;
                if (reqS || exData.jualan) cFinal += `\n[JUALAN]\n${exData.jualan || extractSection(txt, '[JUALAN]')}\n`;
                if (reqR || exData.research) cFinal += `\n[RESEARCH]\n${exData.research || extractSection(txt, '[RESEARCH]')}\n`;
                if (reqI || exData.imageprompt) cFinal += `\n[IMAGEPROMPT]\nOK\n`;
                
                document.getElementById('loading-overlay').style.display = 'none';
                renderResultToDisplay(topic, platform, cFinal, false, isImage);

                if (existingEntry) {
                    await supabaseClient.from('trends_data').update({ ai_suggestion: cFinal }).eq('id', existingEntry.id);
                } else {
                    await supabaseClient.from('trends_data').insert([{ platform, trending_topic: topic, ai_suggestion: cFinal, user_id: guestData.id }]);
                }
                
                fetchHistory();
                document.getElementById('input-topic').value = '';

            } catch (e) {
                document.getElementById('loading-overlay').style.display = 'none';
                showToast(e.message, "error");
            }
        }

        async function fetchHistory() {
            if (!guestData || !guestData.id) return;
            const { data } = await supabaseClient.from('trends_data').select('*').eq('user_id', guestData.id).order('created_at', { ascending: false }).limit(20);
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            if (data) {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.onclick = () => renderResultToDisplay(item.trending_topic, item.platform, item.ai_suggestion, true);
                    div.innerHTML = `<div class="history-text"><i class="fa-regular fa-comment"></i> <span>${item.trending_topic}</span></div><i class="fa-solid fa-trash delete-btn" onclick="event.stopPropagation(); deleteChat(${item.id})"></i>`;
                    list.appendChild(div);
                });
            }
        }

        async function deleteChat(id) {
            if(confirm("Hapus histori?")) {
                await supabaseClient.from('trends_data').delete().eq('id', id);
                fetchHistory();
                startNewChat(); // clear screen
            }
        }
    </script>
