    <style>
        :root {

            --sidebar-bg: #121214;

            --text-main: #fafafa;
            --text-dim: #a1a1aa;

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TOAST NOTIFICATION --- */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(10px); color: white; padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-left: 4px solid var(--accent-blue); transform: translateX(120%); animation: slideInToast 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; display: flex; align-items: center; gap: 12px; }
        .toast.error { border-left-color: #ef4444; }
        .toast.success { border-left-color: #10b981; }
        @keyframes slideInToast { to { transform: translateX(0); } }
        @keyframes fadeOutToast { to { opacity: 0; transform: translateY(-20px); } }

        /* --- GUEST FORM SCREEN --- */
        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #18181b, #09090b); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.5s ease; }
        .auth-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid var(--border-color); padding: 50px 40px; border-radius: 24px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(20px); animation: floatUp 0.6s ease forwards; }
        @keyframes floatUp { to { transform: translateY(0); } }
        .auth-card h2 { margin-top: 0; color: var(--text-main); font-size: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-card h2 i { color: var(--accent-blue); }
        .auth-card p { color: var(--text-dim); font-size: 15px; margin-bottom: 35px; line-height: 1.5; }
        .auth-input, .auth-select { width: 100%; padding: 15px 20px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; border-radius: 12px; outline: none; font-size: 14px; transition: all 0.3s; }
        .auth-input:focus, .auth-select:focus { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .auth-select option { background: var(--bg-dark); color: white; }
        .auth-btn { width: 100%; padding: 15px; background: var(--accent-blue); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-bottom: 15px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .auth-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }

        /* --- APP CONTAINER --- */
        #app-screen { display: none; width: 100%; height: 100%; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 99; opacity: 0; transition: opacity 0.3s; }

        /* --- SIDEBAR --- */
        .sidebar { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; padding: 20px 0; border-right: 1px solid var(--border-color); flex-shrink: 0; z-index: 100; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-header { font-size: 20px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; color: var(--text-main); padding: 0 20px; }
        .sidebar-header i { color: var(--accent-blue); }
        .new-chat-btn { background: rgba(255,255,255,0.03); color: var(--text-main); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; margin: 0 20px 20px 20px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .new-chat-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.4); color: var(--accent-blue); }
        
        .guest-profile { padding: 0 20px 15px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .guest-name { font-size: 14px; font-weight: 600; color: white; margin-bottom: 3px; }
        .guest-detail { font-size: 12px; color: var(--text-dim); }

        .history-container { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 0 15px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        .history-item { padding: 0 12px; height: 48px; border-radius: 12px; margin-bottom: 8px; background: transparent; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; transition: all 0.2s; cursor: pointer; width: 100%; box-sizing: border-box; color: var(--text-dim); }
        .history-item:hover { border-color: rgba(59, 130, 246, 0.3); background: rgba(59, 130, 246, 0.05); color: white; }
        .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 10px; display: flex; align-items: center; gap: 10px; max-width: 180px; }
        .delete-btn { color: #ef4444; cursor: pointer; opacity: 0; transition: opacity 0.2s; padding: 5px; }
        .history-item:hover .delete-btn { opacity: 0.7; }
        .delete-btn:hover { opacity: 1 !important; transform: scale(1.1); }
        .logout-btn { margin: 20px 20px 0 20px; padding: 12px; background: transparent; color: var(--text-dim); border: 1px solid var(--border-color); border-radius: 12px; text-align: center; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }

        /* --- MAIN CONTENT & HEADER --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent); min-width: 0; position: relative; }
        .mobile-header { display: none; padding: 15px 20px; align-items: center; border-bottom: 1px solid var(--border-color); background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(10px); z-index: 50; }
        .menu-toggle { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px; }
        .mobile-title { font-weight: 600; margin-left: 15px; font-size: 16px; }

        .display-area { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 40px 15% 150px 15%; scroll-behavior: smooth; }

        /* --- MODERN SEGMENT CARDS --- */
        .result-header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;}
        .pdf-btn { background: linear-gradient(135deg, #ef4444, #f97316); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .pdf-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5); }

        .ai-card { 
            background: #121214; 
            border-radius: 20px; padding: 30px; margin-bottom: 24px; 
            animation: cardAppear 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
            opacity: 0; transform: translateY(20px); 
            page-break-inside: avoid;
            break-inside: avoid;
            display: block;
        }

        .card-analisis { border-left: 4px solid var(--text-dim); }
        .card-konten { border: 1px solid rgba(168, 85, 247, 0.3); background: linear-gradient(to right, rgba(168,85,247,0.05), #121214); }
        .card-sales { border: 1px dashed rgba(16, 185, 129, 0.5); background: linear-gradient(to right, rgba(16,185,129,0.05), #121214); }
        .card-visual { border: 1px solid var(--border-color); background: #121214; }

        @keyframes cardAppear { to { opacity: 1; transform: translateY(0); } }

        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .card-analisis .section-title { color: var(--text-main); }
        .card-konten .section-title { color: var(--accent-purple); }
        .card-sales .section-title { color: var(--accent-green); }
        .card-visual .section-title { color: var(--accent-blue); }

        /* Teks Rapi, Tidak ada bintang */
        .content-body { line-height: 1.8; color: #e4e4e7; font-size: 15px; word-wrap: break-word; }
        .content-body strong { color: #ffffff; font-weight: 600; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;}
        .content-body ul { margin: 15px 0; padding-left: 20px; list-style-type: '⚡  '; }
        .content-body li { margin-bottom: 12px; padding-left: 5px; }

        /* --- INPUT AREA & TOGGLES (Mobile Slider) --- */
        .input-box { padding: 20px 15% 40px; background: linear-gradient(to top, var(--bg-dark) 80%, transparent); position: absolute; bottom: 0; width: 100%; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 40;}
        .drag-handle { display: none; width: 100%; text-align: center; padding: 10px 0; cursor: pointer; margin-top: -15px; margin-bottom: 5px;}
        .drag-handle span { display: inline-block; width: 50px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 5px; transition: background 0.3s; }
        .drag-handle:hover span { background: var(--accent-blue); }

        .feature-toggles { 
            display: flex; gap: 12px; margin-bottom: 20px; 
            overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .feature-toggles::-webkit-scrollbar { display: none; }
        .toggle-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); color: var(--text-dim); padding: 10px 18px; border-radius: 30px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.3s; flex-shrink: 0; }
        .toggle-btn:hover { background: rgba(255,255,255,0.08); color: white; }
        
        #toggle-content.active { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border-color: rgba(168, 85, 247, 0.4); }
        #toggle-sales.active { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.4); }
        #toggle-image.active { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border-color: rgba(59, 130, 246, 0.4); }

        .input-wrapper { background: rgba(24, 24, 27, 0.8); backdrop-filter: blur(20px); border: 1px solid var(--border-color); border-radius: 20px; padding: 10px 10px 10px 25px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); transition: border 0.3s, box-shadow 0.3s; }
        .input-wrapper:focus-within { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 10px 40px rgba(59, 130, 246, 0.15); }
        .input-wrapper input { flex-grow: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; }
        .input-wrapper input::placeholder { color: #52525b; }
        select#input-platform { background:transparent; color:var(--accent-blue); border:none; outline:none; font-size:14px; font-weight:600; cursor:pointer; }
        select#input-platform option { background: var(--bg-dark); color: white; }

        .action-btn { background: var(--accent-blue); color: white; border: none; padding: 12px 24px; border-radius: 14px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
        .action-btn:hover { background: #2563eb; transform: scale(1.05); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        .loading-overlay { display: none; position: absolute; top: -60px; left: 50%; transform: translateX(-50%); background: rgba(24, 24, 27, 0.9); border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center; gap: 15px; z-index: 10; }
        .spinner { width: 20px; height: 20px; border: 3px solid rgba(59, 130, 246, 0.3); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        .loading-text { font-size: 13.5px; font-weight: 500; color: var(--text-main); }
        .loading-text span { color: var(--accent-blue); animation: pulse 1.5s infinite; }

            .action-btn { width: 100%; justify-content: center; margin-top: 10px; }

        }

        function togglePanel() {
            document.getElementById('input-box').classList.toggle('minimized');
        }
        function minimizePanel() {
            if(window.innerWidth <= 768 && document.getElementById('welcome-msg') == null) {
                document.getElementById('input-box').classList.add('minimized');
            }
        }
        function maximizePanel() {
            document.getElementById('input-box').classList.remove('minimized');
        }

        function showLoading(message) {
            maximizePanel(); 
            const overlay = document.getElementById('loading-overlay');
            const text = document.getElementById('loading-text');
            text.innerHTML = message;
            overlay.style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function startNewChat() {

            displayArea.innerHTML = `
                <div id="welcome-msg" style="text-align:center; margin-top:15vh; animation: floatUp 0.5s ease;">

                    <h1 style="font-size: 42px; margin-bottom:15px; letter-spacing: -1px;">Metan Intelligence.</h1>
                    <p style="color: var(--text-dim); font-size: 16px; max-width: 400px; margin: 0 auto; line-height: 1.6;">
                        Tentukan tren, <strong>pilih fitur yang kamu butuhkan saja</strong>, dan dapatkan strategi pemasaran instan ala Gen-Z.
                    </p>

            `;

        // ==========================================
        // GUEST SESSION MANAGEMENT
        // ==========================================
        function toggleBusinessInput() {
            const val = document.getElementById('guest-has-business').value;
            const input = document.getElementById('guest-business-name');
            if(val === 'yes') {
                input.style.display = 'block';
                input.required = true;
            } else {
                input.style.display = 'none';
                input.required = false;
                input.value = '';
            }

        function startGuestSession() {
            const name = document.getElementById('guest-name').value.trim();
            const region = document.getElementById('guest-region').value.trim();
            const hasBusiness = document.getElementById('guest-has-business').value;
            const businessName = document.getElementById('guest-business-name').value.trim();

            if (!name || !region) {
                showToast("Nama dan Asal Daerah wajib diisi!", "error");
                return;
            }
            if (hasBusiness === 'yes' && !businessName) {
                showToast("Nama Usaha wajib diisi!", "error");
                return;
            }

            // Buat ID Unik Guest agar datanya bisa di-track
            const id = 'guest_' + name.replace(/\s+/g, '_').toLowerCase() + '_' + Math.random().toString(36).substr(2, 5);
            const businessText = hasBusiness === 'yes' ? businessName : 'Belum punya usaha';

            guestData = { id: id, name: name, region: region, business: businessText };
            localStorage.setItem('metan_guest', JSON.stringify(guestData));

            applyGuestData();

            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                showToast("Sesi dimulai, selamat datang " + name + "!", "success");
                fetchHistory();
            }, 400);
        }

        function applyGuestData() {
            if(guestData && guestData.id) {
                document.getElementById('display-guest-name').innerText = guestData.name + " (" + guestData.region + ")";
                document.getElementById('display-guest-detail').innerText = guestData.business;
            }
        }

        function checkSession() {
            const saved = localStorage.getItem('metan_guest');
            if (saved) {
                guestData = JSON.parse(saved);
                applyGuestData();
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                fetchHistory();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }

        function endSession() {
            localStorage.removeItem('metan_guest');
            location.reload();
        }

        window.onload = checkSession; // Panggil saat web diload

        // ==========================================
        // THE ULTIMATE PDF EXPORT (ANTI-BLANK Kloning Rahasia)
        // ==========================================
        function downloadPDF(topicName) {
            showToast("Menyiapkan dokumen PDF...", "success");
            
            const sourceHTML = document.getElementById('export-content').innerHTML;
            const secretContainer = document.getElementById('pdf-secret-container');
            secretContainer.innerHTML = sourceHTML;
            
            // Matikan style yang bikin html2pdf ngebug
            const cards = secretContainer.querySelectorAll('.ai-card');
            cards.forEach(card => {
                card.style.transform = 'none';
                card.style.animation = 'none';
                card.style.pageBreakInside = 'avoid';
                card.style.breakInside = 'avoid';
                card.style.marginBottom = '20px';
                card.style.border = '1px solid rgba(255,255,255,0.1)';
            });

            const opt = {
                margin:       15,
                filename:     `MetanAI_Report_${topicName.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    backgroundColor: '#09090b',
                    windowWidth: 800 
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(secretContainer).save().then(() => {
                showToast("PDF Berhasil Diunduh!", "success");
                secretContainer.innerHTML = ''; 
            }).catch(err => {
                console.error(err);
                showToast("Gagal memproses PDF", "error");
                secretContainer.innerHTML = '';
            });
        }

        // ==========================================
        // SISTEM METAN AI, PARSER & SMART MERGE CACHE
        // ==========================================
        function formatMarkdown(text) {
            let formatted = text;
            // Menghilangkan bintang (*) murni agar rapi sesuai request
            formatted = formatted.replace(/\*/g, '');
            formatted = formatted.replace(/###/g, '');
            formatted = formatted.replace(/^[\-\*]\s+(.*)$/gm, '<ul><li>$1</li></ul>');
            formatted = formatted.replace(/\n/g, '<br>');
            formatted = formatted.replace(/<\/ul><br><ul>/g, '');
            formatted = formatted.replace(/<br><ul/g, '<ul');
            return formatted;
        }

        function extractSection(text, tag) {
            const regex = new RegExp(`\\${tag}([\\s\\S]*?)(?=\\[|$)`);
            const match = text.match(regex);
            return match ? match[1].trim() : '';
        }

        function renderResultToDisplay(topic, aiText, isHistoryClick = false) {
            const displayArea = document.getElementById('display-area');
            const welcomeMsg = document.getElementById('welcome-msg');
            if (welcomeMsg) welcomeMsg.style.display = 'none';

            const toggleContent = document.getElementById('toggle-content').classList.contains('active');
            const toggleSales = document.getElementById('toggle-sales').classList.contains('active');
            const toggleImage = document.getElementById('toggle-image').classList.contains('active');

            const showAnalisis = true; 
            const showKonten = isHistoryClick ? aiText.includes('[KONTEN]') : toggleContent;
            const showJualan = isHistoryClick ? aiText.includes('[JUALAN]') : toggleSales;
            const showVisual = isHistoryClick ? aiText.includes('[IMAGEPROMPT]') : toggleImage;
            
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

            let resultHtml = `
                <div class="result-header-wrapper">
                    <h2 style="color:white; font-size:32px; margin: 0; letter-spacing: -0.5px;"># ${topic}</h2>
                    <button class="pdf-btn" onclick="downloadPDF('${topic}')"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
                </div>
                
                <div id="export-content" style="padding: 10px 0; color: #fafafa; width: 100%;">
                    
                    <div style="border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 25px;">
                        <h3 style="color: var(--accent-blue); margin: 0 0 5px 0; display: flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-bolt"></i> Metan Intelligence Report
                        </h3>
                        <p style="color: var(--text-dim); font-size: 13px; margin: 0;">Disusun untuk: <strong style="color:white;">${guestData.name || 'Guest'}</strong> &nbsp;|&nbsp; Tanggal: ${dateStr}</p>
                    </div>
            `;
            
            let delay = 0;

            if (aiText.includes('[ANALISIS]') && showAnalisis) {
                let text = formatMarkdown(extractSection(aiText, '[ANALISIS]'));
                resultHtml += `<div class="ai-card card-analisis" style="animation-delay: ${delay}s"><div class="section-title"><i class="fa-solid fa-magnifying-glass-chart"></i> Analisis Singkat</div><div class="content-body">${text}</div></div>`;
                delay += 0.15;
            }
            if (aiText.includes('[KONTEN]') && showKonten) {
                let text = formatMarkdown(extractSection(aiText, '[KONTEN]'));
                resultHtml += `<div class="ai-card card-konten" style="animation-delay: ${delay}s"><div class="section-title"><i class="fa-solid fa-video"></i> Ide Konten Viral</div><div class="content-body">${text}</div></div>`;
                delay += 0.15;
            }
            if (aiText.includes('[JUALAN]') && showJualan) {
                let text = formatMarkdown(extractSection(aiText, '[JUALAN]'));
                resultHtml += `<div class="ai-card card-sales" style="animation-delay: ${delay}s"><div class="section-title"><i class="fa-solid fa-tags"></i> Strategi Konversi / Promo</div><div class="content-body">${text}</div></div>`;
                delay += 0.15;
            }

            // Fallback render jika format AI acak-acakan (Format Lama)
            if (!aiText.includes('[ANALISIS]') && !aiText.includes('[KONTEN]') && !aiText.includes('[JUALAN]') && !aiText.includes('[IMAGEPROMPT]')) {
                const parts = aiText.split(/\d\./);
                parts.forEach((p, index) => {
                    if(p.trim().length < 5) return;
                    let title = index === 1 ? "Analisis Pasar" : index === 2 ? "Ide Konten Viral" : "Strategi Konversi";
                    let icon = index === 1 ? "fa-magnifying-glass-chart" : index === 2 ? "fa-video" : "fa-tags";
                    let cssClass = index === 1 ? "card-analisis" : index === 2 ? "card-konten" : "card-sales";
                    
                    if (!isHistoryClick) {
                        if (index === 2 && !showKonten) return;
                        if (index === 3 && !showJualan) return;
                    }

                    let cleanedText = formatMarkdown(p.trim());
                    resultHtml += `<div class="ai-card ${cssClass}" style="animation-delay: ${delay}s"><div class="section-title"><i class="fa-solid ${icon}"></i> ${title}</div><div class="content-body">${cleanedText}</div></div>`;
                    delay += 0.15;
                });
            }

            // GENERASI GAMBAR AI (Aman & Stabil)
            if (showVisual && (aiText.includes('[IMAGEPROMPT]') || isHistoryClick || toggleImage)) {
                let cleanTopic = topic.replace(/[^a-zA-Z0-9\s]/g, '').trim(); 
                if(cleanTopic.length < 3) cleanTopic = "food trend";

                let safePrompt = encodeURIComponent(cleanTopic + " aesthetic modern minimalist high quality");
                let randomSeed = Math.floor(Math.random() * 100000);
                let imgUrl = `https://image.pollinations.ai/prompt/${safePrompt}?width=800&height=450&nologo=true&seed=${randomSeed}`;
                
                let loaderId = 'img-loader-' + Math.random().toString(36).substr(2, 9);
                let fallbackId = 'fallback-' + Math.random().toString(36).substr(2, 9);

                let cssFallback = `document.getElementById('${loaderId}').style.display='none'; document.getElementById('${fallbackId}').style.display='flex'; this.style.display='none';`;

                resultHtml += `
                    <div class="ai-card card-visual" style="animation-delay: ${delay}s">
                        <div class="section-title"><i class="fa-solid fa-image"></i> AI Visualisasi (Prototype)</div>
                        <div style="position: relative; width: 100%; min-height: 250px; background: linear-gradient(135deg, #1e1e24, #09090b); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden;">
                            
                            <div id="${loaderId}" style="position: absolute; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 1;">
                                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; color: var(--accent-blue);"></i>
                                <span style="color: var(--text-dim); font-size: 13px;">Memuat visual untuk: ${topic}</span>
                            </div>
                            
                            <img src="${imgUrl}" 
                                 onload="document.getElementById('${loaderId}').style.display='none'; this.style.opacity=1;" 
                                 onerror="${cssFallback}" 
                                 style="position: relative; z-index: 2; width: 100%; border-radius: 14px; object-fit: cover; opacity: 0; transition: opacity 0.5s;">
                                 
                            <div id="${fallbackId}" style="display: none; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(168,85,247,0.1)); z-index: 3; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 20px;">
                                 <i class="fa-solid fa-palette" style="font-size: 40px; color: var(--accent-blue); opacity: 0.5; margin-bottom: 15px;"></i>
                                 <span style="color: white; font-weight: 600; font-size: 18px; text-transform: capitalize;">Visual Tren: ${topic}</span>
                                 <span style="color: var(--text-dim); font-size: 12px; margin-top: 8px; max-width: 80%;">(Server AI Visual sedang kelebihan beban. Mohon dicoba lagi nanti)</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            resultHtml += `</div>`; 
            displayArea.innerHTML = resultHtml; 
            
            setTimeout(() => {
                displayArea.scrollTo({ top: displayArea.scrollHeight, behavior: 'smooth' });
                minimizePanel();
            }, 300);
            
            if(window.innerWidth <= 768 && document.getElementById('sidebar').classList.contains('active')) {
                toggleSidebar();
            }
        }

        // ==========================================
        // HYBRID AI LOGIC (GEMINI -> GROQ)
        // ==========================================
        async function fetchAIResponse(prompt) {
            // TRY 1: GEMINI (Anti 404 & 400 fix)
            try {
                console.log("Mencoba Gemini...");
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return { source: 'Gemini', text: data.candidates[0].content.parts[0].text };
                }
            } catch (e) {
                console.warn("Gemini limit/error, otomatis beralih ke Groq...", e);
            }

            // TRY 2: GROQ (Llama 3) (Anti Error Suhu/Temperature Fix)
            console.log("Mencoba Groq...");
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${groqApiKey}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192", // Model paling kuat & stabil di Groq
                    messages: [{ role: "user", content: prompt }]
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);
            if (data.choices && data.choices[0]) {
                return { source: 'Groq (Llama 3)', text: data.choices[0].message.content };
            }
            
            throw new Error("Semua server AI sedang sibuk.");
        }


        // ==========================================
        // MAIN DATABASE & CACHE LOGIC
        // ==========================================
        async function processAnalysis(e) {
            if(e) e.stopPropagation(); 
            if (!guestData || !guestData.id) { showToast("Sesi habis, silakan refresh browser.", "error"); return; }

            const topic = document.getElementById('input-topic').value.trim();
            const business = guestData.business || 'UMKM Umum';
            const platform = document.getElementById('input-platform').value;
            
            const isContent = document.getElementById('toggle-content').classList.contains('active');
            const isSales = document.getElementById('toggle-sales').classList.contains('active');
            const isImage = document.getElementById('toggle-image').classList.contains('active');

            if (!topic) { showToast("Masukkan topik tren terlebih dahulu!", "error"); return; }
            if (!isContent && !isSales && !isImage) { showToast("Pilih minimal 1 fitur!", "error"); return; }

            try {
                showLoading("Menyisir <span>database global</span>...");
                
                // 1. CEK DULU DI DATABASE (PENGGUNA LAIN/SENDIRI)
                // Filter menggunakan JS agar tidak error Syntax Supabase 400 Bad Request
                const { data: allCache, error: cacheError } = await supabaseClient
                    .from('trends_data')
                    .select('*')
                    .eq('platform', platform)
                    .order('created_at', { ascending: false });

                if (cacheError) console.warn("Supabase fetch warning:", cacheError);

                let existingEntry = null;
                let existingData = { analisis: '', konten: '', jualan: '', imageprompt: '' };

                if (allCache && allCache.length > 0) {
                    let searchTarget = topic.toLowerCase();
                    for (let item of allCache) {
                        let dbTopic = item.trending_topic.toLowerCase();
                        if (dbTopic === searchTarget || dbTopic.includes(searchTarget) || searchTarget.includes(dbTopic)) {
                            existingEntry = item;
                            let text = item.ai_suggestion || '';
                            if (text.includes('[ANALISIS]')) existingData.analisis = extractSection(text, '[ANALISIS]');
                            if (text.includes('[KONTEN]')) existingData.konten = extractSection(text, '[KONTEN]');
                            if (text.includes('[JUALAN]')) existingData.jualan = extractSection(text, '[JUALAN]');
                            if (text.includes('[IMAGEPROMPT]')) existingData.imageprompt = extractSection(text, '[IMAGEPROMPT]');
                            break; 
                        }
                    }
                }

                // SMART CACHE LOGIC: Cek info yang kurang di database
                let needsAnalisis = true && !existingData.analisis; 
                let needsKonten = isContent && !existingData.konten;
                let needsJualan = isSales && !existingData.jualan;
                let needsImage = isImage && !existingData.imageprompt;

                // JIKA DATABASE SUDAH LENGKAP, LANGSUNG TAMPILKAN (TIDAK PAKAI API AI)
                if (!needsAnalisis && !needsKonten && !needsJualan && !needsImage && existingEntry) {
                    hideLoading();
                    showToast("Data dimuat dari Database Global!", "success");
                    
                    let displayCache = '';
                    if (existingData.analisis) displayCache += `\n[ANALISIS]\n${existingData.analisis}\n`;
                    if (existingData.konten) displayCache += `\n[KONTEN]\n${existingData.konten}\n`;
                    if (existingData.jualan) displayCache += `\n[JUALAN]\n${existingData.jualan}\n`;
                    if (existingData.imageprompt) displayCache += `\n[IMAGEPROMPT]\n${existingData.imageprompt}\n`;

                    renderResultToDisplay(topic, displayCache, false);

                    // Duplikat data ke history pengguna ini jika dia belum pernah nyari ini
                    if (existingEntry.user_id !== guestData.id) {
                        await supabaseClient.from('trends_data').insert([{ 
                            platform: existingEntry.platform, 
                            trending_topic: existingEntry.trending_topic, 
                            ai_suggestion: displayCache,
                            user_id: guestData.id 
                        }]);
                        fetchHistory();
                    }
                    
                    document.getElementById('input-topic').value = '';
                    return; 
                }

                // 3. JIKA ADA DATA YANG KURANG, PANGGIL HYBRID AI
                showLoading("Menganalisis menggunakan <span>Metan AI Hybrid</span>...");
                
                let prompt = `Sebagai pakar digital marketing Gen-Z, analisis tren "${topic}" di ${platform} untuk bisnis: ${business}.
                DILARANG KERAS menggunakan simbol bintang (*) atau hashtag (#) berlebihan. Gunakan format list bullet strip (-) yang rapi.
                HANYA berikan respons untuk bagian di bawah ini, diawali persis dengan TAG KOTAK.\n`;
                
                if (needsAnalisis) prompt += `\n[ANALISIS]\nJelaskan 2-3 kalimat kenapa tren ini viral, tulis dengan rapi.\n`;
                if (needsKonten) prompt += `\n[KONTEN]\nBerikan 2 ide video viral "out of the box" (Sebutkan Hook & Visual secara rapi).\n`;
                if (needsJualan) prompt += `\n[JUALAN]\nBerikan 1 strategi promo, bundling, atau CTA (Call To Action) yang bikin audiens FOMO.\n`;
                if (needsImage) prompt += `\n[IMAGEPROMPT]\nOK\n`;

                const aiResult = await fetchAIResponse(prompt);
                const aiTextResponse = aiResult.text;

                // GABUNG DATA LAMA DI DATABASE + HASIL AI BARU
                let newAnalisis = aiTextResponse.includes('[ANALISIS]') ? extractSection(aiTextResponse, '[ANALISIS]') : '';
                let newKonten = aiTextResponse.includes('[KONTEN]') ? extractSection(aiTextResponse, '[KONTEN]') : '';
                let newJualan = aiTextResponse.includes('[JUALAN]') ? extractSection(aiTextResponse, '[JUALAN]') : '';
                let newImage = aiTextResponse.includes('[IMAGEPROMPT]') ? extractSection(aiTextResponse, '[IMAGEPROMPT]') : '';

                let finalAnalisis = existingData.analisis || newAnalisis;
                let finalKonten = existingData.konten || newKonten;
                let finalJualan = existingData.jualan || newJualan;
                let finalImage = existingData.imageprompt || newImage;

                let combinedFinal = '';
                if (finalAnalisis) combinedFinal += `\n[ANALISIS]\n${finalAnalisis}\n`;
                if (finalKonten) combinedFinal += `\n[KONTEN]\n${finalKonten}\n`;
                if (finalJualan) combinedFinal += `\n[JUALAN]\n${finalJualan}\n`;
                if (finalImage) combinedFinal += `\n[IMAGEPROMPT]\n${finalImage}\n`;
                
                hideLoading();
                showToast(`Strategi sukses diracik oleh ${aiResult.source}!`, "success");
                renderResultToDisplay(topic, combinedFinal, false);

                // UPDATE/INSERT DATABASE BARU KE SUPABASE
                if (existingEntry) {
                    await supabaseClient.from('trends_data').update({ ai_suggestion: combinedFinal }).eq('id', existingEntry.id);
                } else {
                    await supabaseClient.from('trends_data').insert([{ 
                        platform, 
                        trending_topic: topic, 
                        ai_suggestion: combinedFinal,
                        user_id: guestData.id 
                    }]);
                }
                
                fetchHistory();
                document.getElementById('input-topic').value = '';

            } catch (e) {
                console.error('Koneksi Gagal:', e);
                hideLoading();
                showToast("Gagal: " + e.message, "error");
            }
        }

        async function fetchHistory() {
            if (!guestData || !guestData.id) return;
            try {
                const { data } = await supabaseClient
                    .from('trends_data')
                    .select('*')
                    .eq('user_id', guestData.id) // Memunculkan hanya milik guest ini
                    .order('created_at', { ascending: false })
                    .limit(20);
                
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                
                if (data) {
                    data.forEach(item => {
                        const historyItem = document.createElement('div');
                        historyItem.className = 'history-item';
                        historyItem.onclick = () => {
                            renderResultToDisplay(item.trending_topic, item.ai_suggestion, true);
                        };
                        historyItem.innerHTML = `
                            <div class="history-text" title="${item.trending_topic}">
                                <i class="fa-regular fa-message" style="opacity:0.6; font-size:12px;"></i> 
                                <span>${item.trending_topic}</span>
                            </div>
                            <i class="fa-solid fa-trash delete-btn" onclick="event.stopPropagation(); deleteChat(${item.id})" title="Hapus"></i>
                        `;
                        list.appendChild(historyItem);
                    });
                }
            } catch (err) {
                console.error("Gagal menarik histori:", err);
            }
        }

        async function deleteChat(id) {
            if(confirm("Yakin ingin menghapus histori ini?")) {
                await supabaseClient.from('trends_data').delete().eq('id', id);
                showToast("Histori dihapus", "success");
                fetchHistory();
            }
        }
    </script>
