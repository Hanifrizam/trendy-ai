<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trendy AI - Trend Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-dark: #09090b;
            --sidebar-bg: #121214;
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #fafafa;
            --text-dim: #a1a1aa;
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TOAST NOTIFICATION --- */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(20, 20, 25, 0.95); backdrop-filter: blur(10px); color: white; padding: 16px 24px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-left: 4px solid var(--accent-blue); transform: translateX(120%); animation: slideInToast 0.4s cubic-bezier(0.25, 0.8, 0.25, 1) forwards; display: flex; align-items: center; gap: 12px; }
        .toast.error { border-left-color: #ef4444; }
        .toast.success { border-left-color: #10b981; }
        .toast.info { border-left-color: var(--accent-purple); }
        @keyframes slideInToast { to { transform: translateX(0); } }
        @keyframes fadeOutToast { to { opacity: 0; transform: translateY(-20px); } }

        /* --- GUEST FORM SCREEN --- */
        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle at center, #18181b, #09090b); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.5s ease; overflow-y: auto; padding: 20px;}
        .auth-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid var(--border-color); padding: 40px 35px; border-radius: 24px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(20px); animation: floatUp 0.6s ease forwards; margin: auto;}
        @keyframes floatUp { to { transform: translateY(0); opacity: 1; } from { transform: translateY(20px); opacity: 0; } }
        .auth-card h2 { margin-bottom: 10px; color: var(--text-main); font-size: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .auth-card h2 i { color: var(--accent-blue); }
        .auth-card p { color: var(--text-dim); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
        
        .input-group { display: flex; gap: 10px; }
        .auth-input, .auth-select { width: 100%; padding: 14px 18px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: white; border-radius: 12px; outline: none; font-size: 14px; transition: all 0.3s; }
        .auth-input:focus, .auth-select:focus { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .auth-select option { background: var(--bg-dark); color: white; }
        .auth-btn { width: 100%; padding: 15px; background: var(--accent-blue); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; margin-bottom: 5px; transition: all 0.3s; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); }
        .auth-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }

        /* --- APP CONTAINER --- */
        #app-screen { display: none; width: 100%; height: 100%; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 99; opacity: 0; transition: opacity 0.3s; }

        /* --- SIDEBAR --- */
        .sidebar { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; padding: 20px 0; border-right: 1px solid var(--border-color); flex-shrink: 0; z-index: 100; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .sidebar-header { font-size: 20px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; color: var(--text-main); padding: 0 20px; }
        .sidebar-header i { color: var(--accent-blue); }
        
        .guest-profile { padding: 0 20px 15px; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .guest-name { font-size: 14px; font-weight: 600; color: white; margin-bottom: 3px; }
        .guest-detail { font-size: 12px; color: var(--text-dim); }

        .new-chat-btn { background: rgba(255,255,255,0.03); color: var(--text-main); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; margin: 0 20px 20px 20px; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; }
        .new-chat-btn:hover { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.4); color: var(--accent-blue); transform: scale(1.02); }
        
        .history-container { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 0 15px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
        
        .history-item { padding: 0 12px; height: 48px; border-radius: 12px; margin-bottom: 8px; background: transparent; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; transition: all 0.2s; cursor: pointer; width: 100%; box-sizing: border-box; color: var(--text-dim); }
        .history-item.active { background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3); color: var(--accent-blue); }
        .history-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .history-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin-right: 10px; display: flex; align-items: center; gap: 10px; }
        .delete-btn { color: #ef4444; cursor: pointer; opacity: 0; transition: opacity 0.2s; padding: 5px; }
        .history-item:hover .delete-btn { opacity: 0.7; }
        .delete-btn:hover { opacity: 1 !important; transform: scale(1.1); }
        
        .logout-btn { margin: 20px 20px 0 20px; padding: 12px; background: transparent; color: var(--text-dim); border: 1px solid var(--border-color); border-radius: 12px; text-align: center; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.1); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }

        /* --- MAIN CONTENT & HEADER --- */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.05), transparent); min-width: 0; position: relative; }
        .mobile-header { display: none; padding: 15px 20px; align-items: center; border-bottom: 1px solid var(--border-color); background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(10px); z-index: 50; justify-content: space-between;}
        .menu-toggle { background: transparent; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px; }
        .mobile-title { font-weight: 600; font-size: 16px; color: var(--text-main); }

        /* --- CHAT DISPLAY AREA --- */
        .display-area { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding: 40px 15% 180px 15%; scroll-behavior: smooth; display: flex; flex-direction: column; gap: 24px; }
        
        .welcome-wrapper { text-align: center; margin-top: 15vh; animation: floatUp 0.8s ease; flex-shrink: 0; }
        .welcome-icon { font-size: 60px; margin-bottom: 20px; color: var(--accent-blue); opacity: 0.8; }
        .welcome-title { font-size: 42px; margin-bottom: 15px; letter-spacing: -1px; }
        .welcome-subtitle { color: var(--text-dim); font-size: 16px; max-width: 400px; margin: 0 auto; line-height: 1.6; }

        /* CHAT BUBBLES */
        .chat-turn { display: flex; flex-direction: column; gap: 20px; animation: fadeInChat 0.5s ease forwards; width: 100%; }
        @keyframes fadeInChat { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .user-bubble-container { display: flex; justify-content: flex-end; width: 100%; }
        .user-bubble { background: linear-gradient(135deg, #2563eb, #4f46e5); color: white; padding: 16px 24px; border-radius: 20px 20px 4px 20px; max-width: 80%; font-size: 15px; line-height: 1.5; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2); }
        .user-bubble .platform-tag { display: inline-block; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 20px; font-size: 12px; margin-right: 8px; font-weight: 600;}

        .ai-bubble-container { display: flex; flex-direction: column; width: 100%; gap: 15px; }
        
        .chat-report-wrapper { background: transparent; padding-bottom: 10px; }
        .result-header-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .pdf-btn { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .pdf-btn:hover { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.4); color: #ef4444; }

        .ai-card { background: #121214; border-radius: 20px; padding: 25px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; overflow: hidden;}
        .card-analisis { border-left: 4px solid var(--accent-blue); }
        .card-konten { border: 1px solid rgba(168, 85, 247, 0.3); background: linear-gradient(to right, rgba(168,85,247,0.05), #121214); }
        .card-sales { border: 1px dashed rgba(16, 185, 129, 0.5); background: linear-gradient(to right, rgba(16,185,129,0.05), #121214); }
        .card-research { border: 1px solid rgba(245, 158, 11, 0.3); background: linear-gradient(to right, rgba(245,158,11,0.05), #121214); }
        .card-visual { border: 1px solid var(--border-color); background: #121214;}

        .db-badge { position: absolute; top: 0; right: 0; background: rgba(168, 85, 247, 0.2); color: var(--accent-purple); font-size: 10px; padding: 4px 10px; border-bottom-left-radius: 10px; font-weight: 700; letter-spacing: 0.5px;}

        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .section-title i { opacity: 0.8; }
        .card-analisis .section-title i { color: var(--accent-blue); }
        .card-konten .section-title i { color: var(--accent-purple); }
        .card-sales .section-title i { color: var(--accent-green); }
        .card-research .section-title i { color: var(--accent-yellow); }

        .content-body { line-height: 1.8; color: #e4e4e7; font-size: 15px; word-wrap: break-word; }
        .content-body strong { color: #ffffff; font-weight: 600; }
        .content-body ul { margin: 10px 0; padding-left: 20px; list-style-type: disc; }
        .content-body li { margin-bottom: 8px; padding-left: 5px; }

        /* --- INPUT AREA & SLIDER ANIMATIONS --- */
        .input-box { padding: 20px 15% 30px; background: linear-gradient(to top, rgba(9,9,11,1) 60%, rgba(9,9,11,0.8) 85%, transparent); position: absolute; bottom: 0; width: 100%; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s; z-index: 40;}
        
        .drag-handle { display: none; width: 100%; text-align: center; padding: 15px 0 10px; cursor: pointer; margin-top: -25px; }
        .drag-handle span { display: inline-block; width: 40px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 5px; transition: background 0.3s, transform 0.3s; }
        
        .feature-toggles { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 5px; }
        .feature-toggles::-webkit-scrollbar { display: none; }
        .toggle-btn { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); color: var(--text-dim); padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.3s; flex-shrink: 0; }
        .toggle-btn:hover { background: rgba(255,255,255,0.08); color: white; }
        
        #toggle-content.active { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border-color: rgba(168, 85, 247, 0.4); }
        #toggle-sales.active { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); border-color: rgba(16, 185, 129, 0.4); }
        #toggle-research.active { background: rgba(245, 158, 11, 0.15); color: var(--accent-yellow); border-color: rgba(245, 158, 11, 0.4); }
        #toggle-image.active { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border-color: rgba(59, 130, 246, 0.4); }

        .input-wrapper { background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 8px 8px 8px 20px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); transition: border 0.3s, box-shadow 0.3s, transform 0.2s; }
        .input-wrapper:focus-within { border-color: rgba(59, 130, 246, 0.6); box-shadow: 0 10px 40px rgba(59, 130, 246, 0.2); transform: translateY(-2px); }
        .input-wrapper input { flex-grow: 1; background: transparent; border: none; color: white; font-size: 15px; outline: none; padding: 10px 0; }
        .input-wrapper input::placeholder { color: #52525b; }
        select#input-platform { background:transparent; color:var(--accent-blue); border:none; outline:none; font-size:14px; font-weight:600; cursor:pointer; }
        select#input-platform option { background: var(--bg-dark); color: white; }

        .action-btn { background: var(--accent-blue); color: white; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s; flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
        .action-btn:hover { background: #2563eb; transform: scale(1.05); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }

        .loading-overlay { display: none; position: absolute; top: -50px; left: 50%; transform: translateX(-50%); background: rgba(24, 24, 27, 0.95); border: 1px solid var(--accent-blue); padding: 10px 20px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center; gap: 12px; z-index: 10; animation: floatUp 0.3s ease; }
        .spinner { width: 18px; height: 18px; border: 3px solid rgba(59, 130, 246, 0.3); border-top-color: var(--accent-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        .loading-text { font-size: 13px; font-weight: 600; color: var(--text-main); }
        .loading-text span { color: var(--accent-purple); animation: pulse 1.5s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { position: fixed; left: 0; transform: translateX(-100%); top: 0; bottom: 0; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
            .sidebar.active { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.7); }
            .sidebar-overlay.active { display: block; opacity: 1; }
            
            .display-area { padding: 20px 5% 140px 5%; }
            .welcome-title { font-size: 32px; }
            .welcome-icon { font-size: 45px; }

            .input-box { padding: 0 5% 15px 5%; background: rgba(9,9,11,0.98); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.05); }
            .drag-handle { display: block; }
            
            .input-box.minimized { transform: translateY(calc(100% - 30px)); }
            .input-box.minimized .drag-handle span { background: var(--accent-blue); transform: scaleX(1.5); }
            .input-box.minimized .feature-toggles, .input-box.minimized .input-wrapper { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
            
            .feature-toggles, .input-wrapper { opacity: 1; transition: opacity 0.4s ease 0.1s; }
            
            .input-wrapper { flex-wrap: wrap; padding: 12px; border-radius: 16px; gap: 8px; }
            .input-wrapper input[type="text"] { min-width: 100%; padding: 8px 5px; margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.05); }
            .action-btn { width: 100%; justify-content: center; margin-top: 5px; padding: 14px; }
            
            .user-bubble { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="auth-screen">
        <div class="auth-card">
            <h2><i class="fa-solid fa-bolt"></i> Trendy AI</h2>
            <p>Ruang kerja cerdas untuk riset pasar. Silakan isi data sesi Anda.</p>
            
            <input type="text" id="guest-name" class="auth-input" placeholder="Nama Lengkap / Panggilan" required>
            
            <div class="input-group">
                <input type="number" id="guest-age" class="auth-input" placeholder="Umur" required>
                <input type="text" id="guest-job" class="auth-input" placeholder="Pekerjaan" required>
            </div>
            <input type="text" id="guest-nim" class="auth-input" placeholder="NIM (Isi '-' jika bukan mahasiswa)" required>
            
            <input type="text" id="guest-region" class="auth-input" placeholder="Asal Daerah (Cth: Bogor)" required>
            
            <select id="guest-has-business" class="auth-select" onchange="toggleBusinessInput()">
                <option value="no">Belum Punya Usaha</option>
                <option value="yes">Sudah Punya Usaha</option>
            </select>
            
            <input type="text" id="guest-business-name" class="auth-input" placeholder="Nama Usaha Anda" style="display:none;">
            
            <button class="auth-btn" onclick="startGuestSession()">Mulai Analisis <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <div id="app-screen">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-bolt"></i> Trendy AI
            </div>

            <div class="guest-profile">
                <div class="guest-name" id="display-guest-name">Guest User</div>
                <div class="guest-detail" id="display-guest-detail">Belum punya usaha</div>
            </div>
            
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fa-solid fa-pen-to-square"></i> Topik Baru
            </button>

            <div class="history-container" id="history-list"></div>
            <div class="logout-btn" onclick="endSession()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Akhiri Sesi</div>
        </div>

        <div class="main-content">
            <div class="mobile-header">
                <button class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <div class="mobile-title">Trendy Intelligence</div>
                <button class="menu-toggle" onclick="startNewChat()" style="font-size: 16px;"><i class="fa-solid fa-pen-to-square"></i></button>
            </div>

            <div class="display-area" id="display-area" onclick="minimizePanel()">
                </div>

            <div class="input-box" id="input-box">
                <div class="drag-handle" onclick="togglePanel()"><span></span></div>
                
                <div class="loading-overlay" id="loading-overlay">
                    <div class="spinner"></div>
                    <div class="loading-text" id="loading-text">Memproses...</div>
                </div>

                <div class="feature-toggles">
                    <button class="toggle-btn active" id="toggle-content" onclick="this.classList.toggle('active')">
                        <i class="fa-solid fa-video"></i> Ide Konten
                    </button>
                    <button class="toggle-btn active" id="toggle-sales" onclick="this.classList.toggle('active')">
                        <i class="fa-solid fa-tags"></i> Strategi Jualan
                    </button>
                    <button class="toggle-btn" id="toggle-research" onclick="this.classList.toggle('active')">
                        <i class="fa-solid fa-chart-line"></i> Riset
                    </button>
                    <button class="toggle-btn" id="toggle-image" onclick="this.classList.toggle('active')">
                        <i class="fa-solid fa-image"></i> Visual AI
                    </button>
                </div>

                <div class="input-wrapper" onclick="maximizePanel()">
                    <select id="input-platform">
                        <option value="TikTok">TikTok</option>
                        <option value="Instagram">Instagram</option>
                        <option value="Twitter">X/Twitter</option>
                    </select>
                    <input type="text" id="input-topic" placeholder="Ketik tren atau lanjutkan obrolan..." autocomplete="off" onkeypress="handleEnter(event)">
                    <button class="action-btn" onclick="processAnalysis(event)">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://cidccxpjstqnpisuxkcm.supabase.co'; 
        const supabaseKey = 'sb_publishable_CM0leWbXShfwZ9riFphpYQ_r7kRQUPm'; 
        
        const geminiApiKey = 'AIzaSyA4qZIpPpl4SItjhzZ2yPhzkxhis24wF10'; 
        const groqApiKey = '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'; 

        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let guestData = { id: '', name: '', age: '', job: '', nim: '', region: '', business: '' };
        
        let currentChatId = null; 
        let chatContextHistory = []; 

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

        function formatMarkdown(text) {
            if (!text) return "";
            let formatted = text;
            formatted = formatted.replace(/\*\*/g, ''); 
            formatted = formatted.replace(/\*/g, '');
            formatted = formatted.replace(/###/g, '');
            formatted = formatted.replace(/##/g, '');
            formatted = formatted.replace(/^[\-\•]\s+(.*)$/gm, '<ul><li>$1</li></ul>');
            formatted = formatted.replace(/\n/g, '<br>');
            formatted = formatted.replace(/<\/ul><br><ul>/g, '');
            formatted = formatted.replace(/<br><ul/g, '<ul');
            return formatted.trim();
        }

        function extractSection(text, tag) {
            const regex = new RegExp(`\\${tag}([\\s\\S]*?)(?=\\[[A-Z]+\\]|$)`, 'i');
            const match = text.match(regex);
            return match ? match[1].trim() : '';
        }

        async function fetchAIResponse(messagesArray) {
            try {
                console.log("Mencoba Groq (Llama 3.1)...");
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${groqApiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: messagesArray
                    })
                });
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                if (data.choices && data.choices[0]) {
                    return { source: 'Llama 3.1 (Groq)', text: data.choices[0].message.content };
                }
            } catch (e) {
                console.warn("Groq limit/error, otomatis beralih ke Gemini...", e);
            }

            console.log("Mencoba Gemini 1.5 Flash...");
            const geminiContents = messagesArray.map(msg => ({
                role: msg.role === 'assistant' ? 'model' : 'user',
                parts: [{ text: msg.content }]
            }));
            
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: geminiContents })
            });
            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                return { source: 'Gemini', text: data.candidates[0].content.parts[0].text };
            }
            throw new Error("Semua server AI sedang sibuk.");
        }


        // ==========================================
        // MAIN CHAT PROCESSOR (WITH LOCAL RAG / CACHE)
        // ==========================================
        async function processAnalysis(e) {
            if(e) e.stopPropagation(); 
            if (!guestData || !guestData.id) { showToast("Sesi habis, silakan refresh browser.", "error"); return; }

            const inputField = document.getElementById('input-topic');
            const topic = inputField.value.trim();
            const platform = document.getElementById('input-platform').value;
            const business = guestData.business || 'UMKM Umum';
            
            if (!topic) { showToast("Ketik prompt terlebih dahulu!", "error"); return; }

            const isContent = document.getElementById('toggle-content').classList.contains('active');
            const isSales = document.getElementById('toggle-sales').classList.contains('active');
            const isResearch = document.getElementById('toggle-research').classList.contains('active');
            const isImage = document.getElementById('toggle-image').classList.contains('active');

            if (!isContent && !isSales && !isImage && !isResearch) { showToast("Pilih minimal 1 fitur visual/analisis!", "error"); return; }

            const displayArea = document.getElementById('display-area');
            const welcomeMsg = document.querySelector('.welcome-wrapper');
            if (welcomeMsg) welcomeMsg.remove();

            if(!displayArea.querySelector('.chat-report-wrapper')) {
                const headerHtml = `
                    <div class="chat-report-wrapper">
                        <div class="result-header-wrapper">
                            <div>
                                <h3 style="color: var(--accent-blue); margin: 0 0 5px 0;"><i class="fa-solid fa-bolt"></i> Trendy Room Chat</h3>
                                <p style="color: var(--text-dim); font-size: 13px; margin: 0;">Sesi: <strong style="color:white;">${guestData.name}</strong></p>
                            </div>
                            <button class="pdf-btn" onclick="downloadChatPDF()"><i class="fa-solid fa-file-pdf"></i> Ekspor PDF</button>
                        </div>
                    </div>
                `;
                displayArea.insertAdjacentHTML('beforeend', headerHtml);
            }

            const turnId = 'turn_' + Math.random().toString(36).substr(2, 9);
            const userHtml = `
                <div class="chat-turn" id="${turnId}">
                    <div class="user-bubble-container">
                        <div class="user-bubble">
                            <span class="platform-tag">${platform}</span> ${topic}
                        </div>
                    </div>
                    <div class="ai-bubble-container" id="ai_${turnId}">
                        </div>
                </div>
            `;
            displayArea.insertAdjacentHTML('beforeend', userHtml);
            inputField.value = '';
            
            setTimeout(() => displayArea.scrollTo({ top: displayArea.scrollHeight, behavior: 'smooth' }), 50);

            try {
                showLoading("Menyinkronkan Data Tren...");

                // 1. PENCARIAN DATABASE (GLOBAL CACHE RAG)
                let existingData = { analisis: '', konten: '', jualan: '', research: '', imageprompt: '' };
                let foundCache = false;

                if (!currentChatId) {
                    const { data: globalCache } = await supabaseClient
                        .from('trends_data')
                        .select('ai_suggestion')
                        .eq('platform', platform)
                        .ilike('trending_topic', `%${topic}%`)
                        .limit(5); // Ambil maksimal 5 untuk cari yang paling lengkap

                    if (globalCache && globalCache.length > 0) {
                        for (let item of globalCache) {
                            // Ekstrak teks mentah (raw data) yang disembunyikan
                            let match = item.ai_suggestion.match(/<div class="raw-ai-data"[^>]*>([\s\S]*?)<\/div>/);
                            if (match && match[1]) {
                                let rawText = match[1];
                                existingData.analisis = extractSection(rawText, '[ANALISIS]');
                                existingData.konten = extractSection(rawText, '[KONTEN]');
                                existingData.jualan = extractSection(rawText, '[JUALAN]');
                                existingData.research = extractSection(rawText, '[RESEARCH]');
                                existingData.imageprompt = extractSection(rawText, '[IMAGEPROMPT]');
                                foundCache = true;
                                break; 
                            }
                        }
                    }
                }

                // Cek kebutuhan berdasarkan Toggle yang aktif
                let needsAnalisis = true && !existingData.analisis; 
                let needsKonten = isContent && !existingData.konten;
                let needsJualan = isSales && !existingData.jualan;
                let needsResearch = isResearch && !existingData.research;
                
                let finalAiResponse = "";
                let isQuotaSaved = false;

                // JIKA CACHE DB LENGKAP -> BYPASS API (HEMAT KUOTA)
                if (!needsAnalisis && !needsKonten && !needsJualan && !needsResearch && foundCache) {
                    showToast("Sistem Database Pintar Aktif (Hemat Kuota AI) ⚡", "success");
                    isQuotaSaved = true;

                    // Olah Data Lokal (Personalisasi tanpa API)
                    let injectContext = (text) => {
                        if(!text) return "";
                        return `*(Strategi diolah dari Data Tren Global untuk diaplikasikan pada bisnis **${business}** milik **${guestData.name}**)*:\n\n${text}`;
                    };

                    if (existingData.analisis) finalAiResponse += `\n[ANALISIS]\n${injectContext(existingData.analisis)}\n`;
                    if (existingData.research) finalAiResponse += `\n[RESEARCH]\n${injectContext(existingData.research)}\n`;
                    if (existingData.konten) finalAiResponse += `\n[KONTEN]\n${injectContext(existingData.konten)}\n`;
                    if (existingData.jualan) finalAiResponse += `\n[JUALAN]\n${injectContext(existingData.jualan)}\n`;
                    if (existingData.imageprompt) finalAiResponse += `\n[IMAGEPROMPT]\n${existingData.imageprompt}\n`;

                } else {
                    // JIKA INFORMASI KURANG -> PROMPT KE API AI
                    if(foundCache) showToast("Informasi kurang, meminta bantuan AI API...", "info");
                    
                    let promptInstruction = `Sebagai pakar digital marketing, jawab permintaan user terkait topik "${topic}" di platform ${platform}, fokuskan untuk bisnis: ${business}. Jangan gunakan format markdown hash (#) atau bintang (*), gunakan strip (-) biasa.`;
                    
                    if (needsAnalisis) promptInstruction += `\n[ANALISIS]\nBerikan jawaban utama / analisis tren.\n`;
                    if (needsResearch) promptInstruction += `\n[RESEARCH]\nBerikan riset peluang atau data penjualan.\n`;
                    if (needsKonten) promptInstruction += `\n[KONTEN]\nBerikan ide konten viral.\n`;
                    if (needsJualan) promptInstruction += `\n[JUALAN]\nBerikan strategi jualan.\n`;
                    if (isImage) promptInstruction += `\n[IMAGEPROMPT]\nOK\n`;

                    if (chatContextHistory.length === 0) {
                        chatContextHistory.push({ role: "user", content: promptInstruction });
                    } else {
                        chatContextHistory.push({ role: "user", content: `Konteks sebelumnya masih sama (Bisnis: ${business}, Platform: ${platform}). Lanjutan dari user: "${topic}". Tolong jawab menggunakan struktur tag KOTAK jika memungkinkan.\n\n` + promptInstruction });
                    }

                    const aiResult = await fetchAIResponse(chatContextHistory);
                    const aiTextResponse = aiResult.text;

                    chatContextHistory.push({ role: "assistant", content: aiTextResponse });

                    // PARSING ANTI-BLANK DARI API
                    let newAnalisis = ''; let newResearch = ''; let newKonten = ''; let newJualan = ''; let newImage = '';
                    const hasOfficialTags = aiTextResponse.includes('[ANALISIS]') || aiTextResponse.includes('[KONTEN]') || aiTextResponse.includes('[JUALAN]') || aiTextResponse.includes('[RESEARCH]');

                    if (hasOfficialTags) {
                        newAnalisis = aiTextResponse.includes('[ANALISIS]') ? extractSection(aiTextResponse, '[ANALISIS]') : '';
                        newResearch = aiTextResponse.includes('[RESEARCH]') ? extractSection(aiTextResponse, '[RESEARCH]') : '';
                        newKonten = aiTextResponse.includes('[KONTEN]') ? extractSection(aiTextResponse, '[KONTEN]') : '';
                        newJualan = aiTextResponse.includes('[JUALAN]') ? extractSection(aiTextResponse, '[JUALAN]') : '';
                        newImage = aiTextResponse.includes('[IMAGEPROMPT]') ? extractSection(aiTextResponse, '[IMAGEPROMPT]') : '';
                        if (!newAnalisis && aiTextResponse.indexOf('[') > 0) newAnalisis = aiTextResponse.substring(0, aiTextResponse.indexOf('[')).trim();
                    } else {
                        if (isContent && !isSales && !isResearch) newKonten = aiTextResponse;
                        else if (isSales && !isContent && !isResearch) newJualan = aiTextResponse;
                        else if (isResearch && !isContent && !isSales) newResearch = aiTextResponse;
                        else newAnalisis = aiTextResponse; 
                    }

                    // Gabungkan Cache yang ada dengan Data Baru dari API
                    if (existingData.analisis || newAnalisis) finalAiResponse += `\n[ANALISIS]\n${existingData.analisis || newAnalisis}\n`;
                    if (existingData.research || newResearch) finalAiResponse += `\n[RESEARCH]\n${existingData.research || newResearch}\n`;
                    if (existingData.konten || newKonten) finalAiResponse += `\n[KONTEN]\n${existingData.konten || newKonten}\n`;
                    if (existingData.jualan || newJualan) finalAiResponse += `\n[JUALAN]\n${existingData.jualan || newJualan}\n`;
                    if (existingData.imageprompt || newImage) finalAiResponse += `\n[IMAGEPROMPT]\n${existingData.imageprompt || newImage}\n`;
                    
                    showToast(`Prompt Terbuat!`, "success");
                }

                // 3. RENDER AI BUBBLE UI
                let delay = 0;
                let aiHtml = '';
                
                // Tambahkan lencana jika ini adalah data hasil bypass kuota
                const badgeHtml = isQuotaSaved ? `<div class="db-badge"><i class="fa-solid fa-bolt"></i> DARI DATABASE PINTAR</div>` : '';

                const analisisText = extractSection(finalAiResponse, '[ANALISIS]');
                if (analisisText) { aiHtml += `<div class="ai-card card-analisis" style="animation-delay: ${delay}s">${badgeHtml}<div class="section-title"><i class="fa-solid fa-robot"></i> Jawaban / Analisis AI</div><div class="content-body">${formatMarkdown(analisisText)}</div></div>`; delay += 0.15; }
                
                const researchText = extractSection(finalAiResponse, '[RESEARCH]');
                if (researchText && isResearch) { aiHtml += `<div class="ai-card card-research" style="animation-delay: ${delay}s">${badgeHtml}<div class="section-title"><i class="fa-solid fa-chart-line"></i> Riset Data</div><div class="content-body">${formatMarkdown(researchText)}</div></div>`; delay += 0.15; }

                const kontenText = extractSection(finalAiResponse, '[KONTEN]');
                if (kontenText && isContent) { aiHtml += `<div class="ai-card card-konten" style="animation-delay: ${delay}s">${badgeHtml}<div class="section-title"><i class="fa-solid fa-video"></i> Ide Konten</div><div class="content-body">${formatMarkdown(kontenText)}</div></div>`; delay += 0.15; }
                
                const jualanText = extractSection(finalAiResponse, '[JUALAN]');
                if (jualanText && isSales) { aiHtml += `<div class="ai-card card-sales" style="animation-delay: ${delay}s">${badgeHtml}<div class="section-title"><i class="fa-solid fa-tags"></i> Strategi Sales</div><div class="content-body">${formatMarkdown(jualanText)}</div></div>`; delay += 0.15; }

                if (isImage) {
                    let cleanTopic = topic.replace(/[^a-zA-Z0-9\s]/g, '').trim(); 
                    if(cleanTopic.length < 3) cleanTopic = "trend";
                    let safePrompt = encodeURIComponent(cleanTopic + " aesthetic modern minimalist high quality");
                    let randomSeed = Math.floor(Math.random() * 100000);
                    let imgUrl = `https://image.pollinations.ai/prompt/${safePrompt}?width=800&height=450&nologo=true&seed=${randomSeed}`;
                    let loaderId = 'img-' + Math.random().toString(36).substr(2, 5);
                    
                    aiHtml += `
                        <div class="ai-card card-visual" style="animation-delay: ${delay}s">
                            <div class="section-title"><i class="fa-solid fa-image"></i> Referensi Visual</div>
                            <div style="position: relative; width: 100%; min-height: 200px; background: #09090b; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden;">
                                <div id="${loaderId}" style="position: absolute; z-index: 1;"><i class="fa-solid fa-spinner fa-spin" style="color:var(--accent-blue);"></i></div>
                                <img src="${imgUrl}" onload="document.getElementById('${loaderId}').style.display='none'; this.style.opacity=1;" style="position: relative; z-index: 2; width: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s;">
                            </div>
                        </div>
                    `;
                }

                // 4. EMBED RAW DATA KE DALAM HTML AGAR BISA DIGUNAKAN OLEH USER SELANJUTNYA
                aiHtml += `<div class="raw-ai-data" style="display:none;">${finalAiResponse}</div>`;

                document.getElementById(`ai_${turnId}`).innerHTML = aiHtml;

                // UPDATE HIDDEN CONTEXT & SAVE KE SUPABASE
                let oldContext = displayArea.querySelector('.chat-context-data');
                if(oldContext) oldContext.remove();
                
                const contextDiv = document.createElement('div');
                contextDiv.className = 'chat-context-data';
                contextDiv.style.display = 'none';
                contextDiv.textContent = JSON.stringify(chatContextHistory);
                displayArea.appendChild(contextDiv);

                const fullRoomHtml = displayArea.innerHTML;
                let titleTopic = topic.length > 25 ? topic.substring(0,25) + '...' : topic;

                if (currentChatId) {
                    await supabaseClient.from('trends_data').update({ ai_suggestion: fullRoomHtml }).eq('id', currentChatId);
                } else {
                    const { data, error } = await supabaseClient.from('trends_data').insert([{ 
                        platform, 
                        trending_topic: titleTopic,
                        ai_suggestion: fullRoomHtml,
                        user_id: guestData.id 
                    }]).select();
                    
                    if(data && data.length > 0) {
                        currentChatId = data[0].id;
                    }
                }
                
                hideLoading();
                fetchHistory();
                setTimeout(() => { displayArea.scrollTo({ top: displayArea.scrollHeight, behavior: 'smooth' }); minimizePanel(); }, 300);

            } catch (e) {
                console.error('Koneksi Gagal:', e);
                hideLoading();
                showToast("Sistem gagal merespon: " + e.message, "error");
            }
        }

        async function fetchHistory() {
            if (!guestData || !guestData.id) return;
            try {
                const { data } = await supabaseClient
                    .from('trends_data')
                    .select('id, trending_topic, ai_suggestion')
                    .eq('user_id', guestData.id) 
                    .order('created_at', { ascending: false })
                    .limit(20);
                
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                
                if (data) {
                    data.forEach(item => {
                        const historyItem = document.createElement('div');
                        historyItem.className = `history-item ${item.id === currentChatId ? 'active' : ''}`;
                        historyItem.id = `hist-${item.id}`;
                        historyItem.onclick = () => {
                            loadChatRoom(item.id, item.ai_suggestion);
                        };
                        historyItem.innerHTML = `
                            <div class="history-text" title="${item.trending_topic}">
                                <i class="fa-regular fa-message" style="opacity:0.6; font-size:12px;"></i> 
                                <span>${item.trending_topic}</span>
                            </div>
                            <i class="fa-solid fa-trash delete-btn" onclick="event.stopPropagation(); deleteChat(${item.id})" title="Hapus"></i>
                        `;
                        list.appendChild(historyItem);
                    });
                }
            } catch (err) {
                console.error("Gagal menarik histori:", err);
            }
        }

        async function deleteChat(id) {
            if(confirm("Yakin ingin menghapus obrolan ini?")) {
                await supabaseClient.from('trends_data').delete().eq('id', id);
                if(currentChatId === id) startNewChat(); 
                showToast("Histori dihapus", "success");
                fetchHistory();
            }
        }
    </script>
</body>
</html>
